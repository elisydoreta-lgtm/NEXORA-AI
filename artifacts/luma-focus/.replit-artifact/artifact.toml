kind = "web"
previewPath = "/"
title = "NEXORA AI"
description = "A premium mobile-first business intelligence and operations workspace for small and medium businesses, with executive metrics, AI insights, and human-approved actions."
version = "1.0.0"
id = "artifacts/luma-focus"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22474

[services.development]
run = "pnpm --filter @workspace/luma-focus run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/luma-focus", "run", "build" ]
serve = "static"
publicDir = "artifacts/luma-focus/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22474"
BASE_PATH = "/"
